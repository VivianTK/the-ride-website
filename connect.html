<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ride Premium Indoor Cycling</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header id="main-header">
        <div class="container">
                <nav>
                <img src="assets/theridelogo.png" alt="The-Ride-Logo" class="logo">
                <ul class="nav-list">
                    <li> <a href="index.html">Home</a> </li>
                    <li> <a href="buy.html">Buy</a> </li>
                    <li> <a href="studio.html">Studio</a> </li>
                    <li> <a href="firstriders.html">First Riders</a> </li>
                    <li> <a href="connect.html">Connect</a> </li>
                    <li> <button class="btn btn-secondary">Sign In</button> </li>
                </ul>
            </nav>
        </div>

         <section id="find-us">
            <h1>Find Us</h1>
 
            <div class="map-wrapper">
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d805.8085011142024!2d-115.30742023040366!3d36.11215639827823!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c8b8b55d4512f3%3A0x19895cce2e7e7bc4!2s4245%20S%20Grand%20Canyon%20Dr%20UNIT%20116%2C%20Las%20Vegas%2C%20NV%2089148!5e0!3m2!1sen!2sus!4v1776134017887!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
 
            <div class="address-box">
                4245 South Grand Canyon Drive #116 Las Vegas, NV, 89147
                <br>702-202-1229<br>
                <br>info@theridecycling.com<br>
            </div>
        </section>

    </header>

    <main>
        <section id="connect-friends">
            <h2>Share with Friends</h2>
            <div class="friends-row">
                <div class="friends-img-slot">
                    <img src="assets/Friends-Bar.png" alt="Add Friends">
                </div>
 
                <!--
                    TEXT MESSAGE BOX image slot
                    Replace the img src with your image file, e.g.:
                    <img src="assets/text-message.png" alt="Text Message">
                -->
                <div class="message-img-slot">
                    <img src="assets/Message.png" alt="Text Message">
                </div>
 
            </div>
        </section>
 
        <section id="connect-us">
            <h2>Connect With Us</h2>
 
            <div class="contact-form">
                <input type="email" id="contact-email" placeholder="Your email address" required>
                <textarea id="contact-message" placeholder="Your message"></textarea>
                <button class="send-btn" onclick="handleSend()">Send</button>
            </div>
        </section> 
    </main>
    
    <footer>
        <div class="container">
            <ul class="footer-list">
                    <li> <a href="#">FAQ</a> </li>
                    <li> <a href="#">Careers</a> </li>
                    <li> <a href="#">Press</a> </li>
                    <li> <a href="#">Terms</a> </li>
                    <li> <a href="#">Privacy</a> </li>
                    <li> <a href="#">Contact</a> </li>
            </ul>
            <img src="assets/theridelogo.png" alt="TheRide-Logo" class="footer-logo">
            <p><b>Las Vegas, NV</b></p>
        </div>
    </footer>
    
</body>
</html>
